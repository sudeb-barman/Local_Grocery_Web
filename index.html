<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Grocery Web - Orders</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='index_css.css') }}">
        <!-- <link rel="stylesheet" href="index_css.css"> -->

</head>


<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">

            <img src="{{ url_for('static', filename='grocery logo.jpg') }}"
                 alt="Grocery Logo">

        </div>

        <div>

            <h2>Grocery Web</h2>

            <span>Management</span>

        </div>

    </div>


    <nav>

            
        <a href="/index" class="menu active">
            <span>📦</span>
            Orders
        </a>
        <a href="/dashboard" class="menu">
            <span>📊</span>
            Dashboard
        </a>

        <a href="/products" class="menu">
            <span>➕</span>
            New Product
        </a>

        <a href="/customer" class="menu">
            <span>🛒</span>
            Customer page
        </a>



    </nav>


    <div class="sidebar-bottom">

        <p>Sudeshna's Grocery</p>

        <small>
            Grocery Management System
        </small>

    </div>

</aside>



<!-- ================= MAIN ================= -->

<main class="main">


    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h1>Orders</h1>

            <p>
                View all customer orders
            </p>

        </div>

    </div>



    <!-- ================= ORDER TABLE ================= -->

    <div class="content-box">

        <div class="content-header">

            <div>

                <h2>📦 All Orders</h2>

                <p>
                    Orders stored in the database
                </p>

            </div>

        <table>

            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Customer Name</th>

                    <th>Total</th>

                    <th>Date & Time</th>

                </tr>

            </thead>


            <tbody id="orderTable">

            </tbody>

        </table>

    </div>


</main>



<script>

function loadOrders() {

    fetch("/api/orders")

        .then(response => response.json())

        .then(orders => {

            let table =
                document.getElementById("orderTable");

            table.innerHTML = "";


            orders.forEach(order => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${order.order_id}
                        </td>

                        <td>
                            ${order.customer_name}
                        </td>

                        <td>
                            ₹${order.total}
                        </td>

                        <td>
                            ${order.date_time}
                        </td>

                    </tr>

                `;

            });

        })

        .catch(error => {

            console.log("Error:", error);

        });

}


// Load orders when page opens
document.addEventListener(
    "DOMContentLoaded",
    loadOrders
);

</script>


</body>

</html>
